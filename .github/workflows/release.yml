name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          [xml]$project = Get-Content ./src/Flyt.Cli/Flyt.Cli.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match project version v$version."
          }
      - run: dotnet restore FlytV1.slnx
      - run: dotnet build FlytV1.slnx --configuration Release --no-restore
      - run: dotnet test FlytV1.slnx --configuration Release --no-build
      - name: Build x64 and ARM64 packages
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Runtime win-x64
          ./scripts/package.ps1 -Runtime win-arm64
      - name: Publish private GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:RELEASE_TAG artifacts/packages/*.zip artifacts/packages/*.sha256 --repo "${{ github.repository }}" --verify-tag --generate-notes
