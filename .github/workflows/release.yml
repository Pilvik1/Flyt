name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FlytV1.slnx
      - run: dotnet build FlytV1.slnx --configuration Release --no-restore
      - run: dotnet test FlytV1.slnx --configuration Release --no-build

  package:
    needs: verify
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          [xml]$project = Get-Content ./src/Flyt.Cli/Flyt.Cli.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match project version v$version."
          }
      - name: Build package
        shell: pwsh
        run: ./scripts/package.ps1 -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v6
        with:
          name: flyt-${{ matrix.runtime }}
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.sha256
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: flyt-*
          path: artifacts
          merge-multiple: true
      - name: Publish private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --repo "${{ github.repository }}" --verify-tag --generate-notes
