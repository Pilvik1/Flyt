name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet tool restore
      - run: dotnet restore Flyt.slnx
      - run: dotnet build Flyt.slnx --configuration Release --no-restore
      - run: dotnet format Flyt.slnx --verify-no-changes --no-restore
      - run: dotnet test Flyt.slnx --configuration Release --no-build
      - name: Dependency vulnerability audit
        run: dotnet list Flyt.slnx package --vulnerable --include-transitive
      - name: Install pinned psmux for live Windows proof
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $uri = 'https://github.com/psmux/psmux/releases/download/v3.4.0/psmux-v3.4.0-windows-x64.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'psmux-v3.4.0-windows-x64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'psmux-v3.4.0'
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $expected = 'a66b6be7c13c6fa0dc3660a267b9e34eaa91a4eb7f07fbd55a0468018bd0f721'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "psmux checksum mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$destination;$env:PATH"
          psmux -V
      - name: Live ten-pane Windows psmux integration proof
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $psmux = Join-Path $env:RUNNER_TEMP 'psmux-v3.4.0'
          $env:PATH = "$psmux;$env:PATH"
          ./scripts/ci-psmux-live.ps1 `
            -FlytDll ./src/Flyt.Cli/bin/Release/net10.0/flyt.dll `
            -WorkspacePath $PWD.Path
      - name: CLI smoke test
        run: dotnet src/Flyt.Cli/bin/Release/net10.0/flyt.dll desk start --name ci-smoke --path . --sessions "claude:builder,codex:reviewer,shell:ops" --dry-run
      - name: PowerShell module import
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Module ./powershell/Flyt/Flyt.psd1 -Force
          @(
            'Start-FlytDesk'
            'Watch-FlytDesk'
            'Send-FlytDeskText'
            'Repair-FlytDesk'
            'Get-FlytDeskFailure'
            'New-FlytDeskTemplate'
            'New-FlytDeskHandoff'
            'Open-FlytDesk'
            'Add-FlytDeskWork'
            'Get-FlytDeskWork'
            'Invoke-FlytDeskQueue'
            'Stop-FlytDeskWork'
            'Get-FlytDeskHistory'
            'Test-FlytDeskNotification'
            'Enable-FlytCompletion'
          ) | ForEach-Object { Get-Command $_ -ErrorAction Stop }
          $line = 'flyt desk con'
          $completions = (TabExpansion2 $line $line.Length).CompletionMatches.CompletionText
          if ($completions -notcontains 'configure') {
            throw "Flyt native completion did not suggest 'configure': $($completions -join ', ')"
          }
          $line = 'flyt desk configure --work'
          $completions = (TabExpansion2 $line $line.Length).CompletionMatches.CompletionText
          if ($completions -notcontains '--working-directories') {
            throw "Flyt native completion did not suggest '--working-directories': $($completions -join ', ')"
          }
      - name: Package and install smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Runtime win-x64
          $package = Get-ChildItem ./artifacts/packages/Flyt-*-win-x64.zip -File -ErrorAction Stop | Select-Object -First 1
          $sbom = Get-ChildItem ./artifacts/packages/Flyt-*-win-x64.spdx.json -File -ErrorAction Stop | Select-Object -First 1
          if ((Get-Content $sbom.FullName -Raw | ConvertFrom-Json).spdxVersion -ne 'SPDX-2.2') {
            throw 'Package SBOM is not SPDX 2.2.'
          }
          ./scripts/install.ps1 `
            -PackagePath $package.FullName `
            -ChecksumPath "$($package.FullName).sha256" `
            -InstallRoot "$env:RUNNER_TEMP/flyt-app" `
            -ModuleRoot "$env:RUNNER_TEMP/flyt-modules/Flyt" `
            -SkipPathUpdate `
            -NonInteractive
          @(
            "$env:RUNNER_TEMP/flyt-app/current/LICENSE"
            "$env:RUNNER_TEMP/flyt-app/current/THIRD-PARTY-NOTICES.md"
            "$env:RUNNER_TEMP/flyt-app/current/_manifest/spdx_2.2/manifest.spdx.json"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_)) { throw "Packaged public-release file missing: $_" }
          }
          & "$env:RUNNER_TEMP/flyt-app/current/flyt.exe" version
